name: Build ESP8266 tasmota.bin

on:
  workflow_dispatch:      # Manual start from the Actions tab
  push:
    branches:
      - claude/tasmota-rtc-esp8266-gcb1sl
      - claude/tasmota-rtc-ap-ntp

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install -U pioarduino   # same as upstream Tasmota CI (plain platformio breaks on SCons)
      - name: Build tasmota (ESP8266)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e tasmota
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasmota-esp8266-rtc
          path: ./build_output
      - name: Commit built firmware to the branch
        if: github.ref_name == 'claude/tasmota-rtc-ap-ntp'
        run: |
          mkdir -p built-firmware
          cp build_output/firmware/tasmota.bin build_output/firmware/tasmota.bin.gz built-firmware/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f built-firmware
          git commit -m "Built firmware for ${GITHUB_SHA::7} [skip ci]"
          git push
